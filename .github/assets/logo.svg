<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1612"/>
      <stop offset="50%" stop-color="#080b0c"/>
      <stop offset="100%" stop-color="#180910"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5a3"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34f5c5"/>
      <stop offset="100%" stop-color="#00b884"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff5c77"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffe55c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Outer contrast shell (visible on both #ffffff and #000000) -->
  <rect x="4" y="4" width="248" height="248" rx="52" fill="#070a09" stroke="#1e2926" stroke-width="4"/>
  <rect x="12" y="12" width="232" height="232" rx="44" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="8"/>

  <!-- Detached Header Bar (lifted up, crimson & gold) -->
  <rect x="48" y="38" width="160" height="46" rx="12" fill="#1f0910" stroke="url(#crimsonGrad)" stroke-width="16"/>
  <rect x="68" y="53" width="48" height="16" rx="5" fill="url(#goldGrad)"/>
  <rect x="128" y="53" width="32" height="16" rx="5" fill="#f1f5f9"/>
  <circle cx="180" cy="61" r="8" fill="url(#goldGrad)"/>
  <!-- Cut / Separation Line (Gold dashes aligned to 16px grid) -->
  <path d="M 44 104 H 80 M 108 104 H 148 M 176 104 H 212"
        stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round"/>
  <!-- Stripped Asset Body (Emerald frame with image landscape geometry) -->
  <rect x="48" y="124" width="160" height="92" rx="14" fill="#061a14" stroke="url(#emeraldGrad)" stroke-width="16"/>
  <!-- Mountain / Raster Payload inside Body -->
  <path d="M 64 200 L 104 154 L 136 186 L 160 162 L 192 200 Z" fill="url(#emeraldGrad)"/>
  <circle cx="164" cy="148" r="11" fill="url(#goldGrad)"/>
</svg>
